<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24" />
      <stop offset="100%" stop-color="#111317" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC3E8F" />
      <stop offset="100%" stop-color="#FF65AD" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="300" rx="12" fill="url(#bgGrad)" stroke="#2D333F" stroke-width="2"/>

  <!-- Circuit Pattern Background (subtle) -->
  <g stroke="#262C37" stroke-width="1.5" fill="none">
    <path d="M40 50 h60 l30 30 v40" />
    <circle cx="130" cy="120" r="3" fill="#262C37" />
    <path d="M360 250 h-60 l-30 -30 v-40" />
    <circle cx="270" cy="180" r="3" fill="#262C37" />
    <path d="M350 60 h-40 l-20 20" />
    <circle cx="290" cy="80" r="3" fill="#262C37" />
    <path d="M50 240 h50 l20 -20" />
    <circle cx="120" cy="220" r="3" fill="#262C37" />
  </g>

  <!-- Central Chip / Hardware Icon Box -->
  <g transform="translate(155, 80)">
    <rect x="0" y="0" width="90" height="90" rx="16" fill="#232832" stroke="url(#brandGrad)" stroke-width="2.5" />
    
    <!-- Chip Pins -->
    <line x1="20" y1="-8" x2="20" y2="0" stroke="#EC3E8F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="45" y1="-8" x2="45" y2="0" stroke="#EC3E8F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="70" y1="-8" x2="70" y2="0" stroke="#EC3E8F" stroke-width="2.5" stroke-linecap="round" />
    
    <line x1="20" y1="90" x2="20" y2="98" stroke="#EC3E8F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="45" y1="90" x2="45" y2="98" stroke="#EC3E8F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="70" y1="90" x2="70" y2="98" stroke="#EC3E8F" stroke-width="2.5" stroke-linecap="round" />

    <line x1="-8" y1="20" x2="0" y2="20" stroke="#EC3E8F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-8" y1="45" x2="0" y2="45" stroke="#EC3E8F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-8" y1="70" x2="0" y2="70" stroke="#EC3E8F" stroke-width="2.5" stroke-linecap="round" />

    <line x1="90" y1="20" x2="98" y2="20" stroke="#EC3E8F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="90" y1="45" x2="98" y2="45" stroke="#EC3E8F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="90" y1="70" x2="98" y2="70" stroke="#EC3E8F" stroke-width="2.5" stroke-linecap="round" />

    <!-- Center Emblem / Graphic -->
    <polygon points="45,22 68,36 68,64 45,78 22,64 22,36" fill="none" stroke="#EC3E8F" stroke-width="2" />
    <circle cx="45" cy="50" r="10" fill="url(#brandGrad)" />
  </g>

  <!-- Typography -->
  <text x="200" y="210" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    PUPE<tspan fill="#EC3E8F">FACTORY</tspan>
  </text>
  <text x="200" y="235" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#8A94A6" text-anchor="middle">
    Imagen no disponible / Hardware Original
  </text>
</svg>
